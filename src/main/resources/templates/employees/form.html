<!DOCTYPE html>
<!-- 担当：指輪（画面）。変更する前に templates/README.md を読み、担当外の人は担当者に相談する -->
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isNew} ? '社員を登録' : '社員詳細')}"></head>
<body>
<div class="app">
  <nav th:replace="~{fragments/layout :: nav('employees')}"></nav>
  <main class="main">
    <a class="back" th:href="@{/employees}">← 社員一覧へ戻る</a>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- 見出し -->
    <div class="row between mb" th:if="${isNew}"><h1>社員を登録</h1></div>
    <div class="row between mb" th:unless="${isNew}" style="align-items:flex-end">
      <div><div class="muted" th:text="${employee.employeeNo} + '　' + ${employee.department ?: ''}"></div>
        <h1><span th:text="${employee.name}"></span> <span class="kana" th:text="${employee.kana}"></span></h1></div>
      <form th:action="@{/employees/{no}/delete(no=${employee.employeeNo})}" method="post"
            onsubmit="return confirm('削除すると社員一覧から消え、勤怠シートの本人への共有を止めます。勤怠シートは残します。よろしいですか？')">
        <button class="btn-danger">この社員を削除</button>
      </form>
    </div>
    <p class="muted lead" th:if="${isNew}">勤怠シートのURLが空なら、ひな型から勤怠シートと個人フォルダを作り、入社日の朝に本人へ共有します。<span class="req">*</span> は必須です。</p>

    <form th:object="${form}" th:action="${isNew} ? @{/employees/new} : @{/employees/{no}(no=${employee.employeeNo})}" method="post">
      <h2 class="section">基本情報</h2>
      <div class="card pad grid">
        <label>社員番号 <span class="req">*</span><input th:field="*{no}" th:readonly="${!isNew}" placeholder="E0004" th:errorclass="bad"><small class="field-error" th:errors="*{no}"></small></label>
        <label>氏名 <span class="req">*</span><input th:field="*{name}" placeholder="例：佐藤 花子" th:errorclass="bad"><small class="field-error" th:errors="*{name}"></small></label>
        <label>フリガナ<input th:field="*{kana}" placeholder="サトウ ハナコ"></label>
        <label>メールアドレス <span class="req">*</span><input th:field="*{mail}" type="email" placeholder="hanako@example.com" th:errorclass="bad"><small class="field-error" th:errors="*{mail}"></small></label>
        <label>所属<input th:field="*{dept}" placeholder="開発部"></label>
        <label>雇用形態<select th:field="*{type}"><option th:each="t : ${ {'正社員','契約社員','パート・アルバイト'} }" th:value="${t}" th:text="${t}"></option></select></label>
        <label>入社日 <span class="req">*</span><input th:field="*{joined}" type="date" th:errorclass="bad"><small class="field-error" th:errors="*{joined}"></small></label>
        <label th:unless="${isNew}">在籍<select th:field="*{status}"><option th:each="s : ${ {'在籍','休職'} }" th:value="${s}" th:text="${s}"></option></select></label>
      </div>

      <h2 class="section">給与条件</h2>
      <div class="card pad grid">
        <label>給与形態<select th:field="*{payType}"><option th:each="p : ${ {'月給','日給','時給'} }" th:value="${p}" th:text="${p}"></option></select></label>
        <label>基本給（円）<input th:field="*{base}" inputmode="numeric" th:errorclass="bad"><small class="field-error" th:errors="*{base}"></small></label>
        <label>1日の標準時間<input th:field="*{stdTime}" placeholder="8:00" th:errorclass="bad"><small class="field-error" th:errors="*{stdTime}"></small></label>
      </div>
      <p class="muted">給与計算は社労士が行います。ここでは社労士に渡す条件を登録します。</p>

      <h2 class="section">手当</h2>
      <div class="card pad grid">
        <label>通勤手当（月額・円）<input th:field="*{commute}" inputmode="numeric" th:errorclass="bad"><small class="field-error" th:errors="*{commute}"></small></label>
        <label>住宅手当（月額・円）<input th:field="*{housing}" inputmode="numeric" th:errorclass="bad"><small th:text="${housingNote}"></small><small class="field-error" th:errors="*{housing}"></small></label>
        <label>固定手当（月額・円）<input th:field="*{fixed}" inputmode="numeric" th:errorclass="bad"><small class="field-error" th:errors="*{fixed}"></small></label>
        <label>固定手当の名前<input th:field="*{fixedName}" placeholder="例：資格手当"></label>
      </div>

      <h2 class="section">案件・参画履歴</h2>
      <div class="card table-wrap">
        <table class="table" style="min-width:600px">
          <thead><tr><th>案件</th><th>インセンティブ月額（円）</th><th>参画開始</th><th>参画終了</th></tr></thead>
          <tbody id="history-rows">
          <tr th:each="h, st : *{history}">
            <td><input th:field="*{history[__${st.index}__].project}" placeholder="案件名"></td>
            <td><input th:field="*{history[__${st.index}__].amount}" inputmode="numeric"></td>
            <td><input th:field="*{history[__${st.index}__].from}" type="date"></td>
            <td><input th:field="*{history[__${st.index}__].to}" type="date"></td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:10px">
        <button type="button" class="btn-outline" id="add-history-row">＋ 行を追加</button>
        <span class="muted">行を消すときは案件名を空にして保存します。</span>
      </div>
      <script>
        // 「行を追加」：最後の行を複製し、番号（history[0] など）を次の番号に付け替えて空にする（保存は今までどおり）
        document.getElementById('add-history-row').addEventListener('click', function () {
          var body = document.getElementById('history-rows');
          var rows = body.querySelectorAll('tr');
          if (rows.length === 0) return;
          var next = rows.length;
          var row = rows[rows.length - 1].cloneNode(true);
          row.querySelectorAll('input').forEach(function (input) {
            input.name = input.name.replace(/history\[\d+\]/, 'history[' + next + ']');
            input.id = input.id.replace(/history\d+/, 'history' + next);
            input.value = '';
          });
          body.appendChild(row);
          row.querySelector('input').focus();
        });
      </script>

      <h2 class="section">勤怠シート</h2>
      <div class="card pad">
        <div class="grid">
          <label>勤怠シートのURL<input th:field="*{sheetUrl}" placeholder="https://docs.google.com/spreadsheets/d/…" th:errorclass="bad">
            <small th:text="${isNew} ? '空なら、ひな型から新しく作ります。既存のシートを使うときはURLを貼ってください' : '既存の別のスプレッドシートに差し替えるときは、そのURLを貼って保存します'"></small>
            <small class="field-error" th:errors="*{sheetUrl}"></small></label>
          <label>個人フォルダのURL（任意）<input th:field="*{folderUrl}" placeholder="https://drive.google.com/drive/folders/…" th:errorclass="bad"><small class="field-error" th:errors="*{folderUrl}"></small></label>
        </div>
        <div class="row" style="margin-top:12px" th:unless="${isNew}">
          <a th:if="${employee.sheetUrl}" th:href="${employee.sheetUrl}" target="_blank" rel="noreferrer">勤怠シートを開く</a>
          <a th:if="${employee.folderUrl}" th:href="${employee.folderUrl}" target="_blank" rel="noreferrer">個人フォルダを開く</a>
          <span class="muted">本人への共有：</span><span class="tag" th:classappend="${employee.shareState == '共有済み'} ? 'ok' : 'wait'" th:text="${employee.shareState}"></span>
        </div>
      </div>

      <div class="row" style="margin-top:18px">
        <button class="btn" th:text="${isNew} ? '登録する' : '変更を保存'">保存</button>
        <a class="btn-sub" th:href="@{/employees}">キャンセル</a>
      </div>
    </form>

    <form th:unless="${isNew}" th:action="@{/employees/{no}/recreate-sheet(no=${employee.employeeNo})}" method="post" style="margin-top:14px"
          onsubmit="return confirm('ひな型から新しい勤怠シートを作ります。今のシートは残ります。よろしいですか？')">
      <button class="btn-sub">ひな型から勤怠シートを作り直す</button>
    </form>
  </main>
</div>
</body>
</html>
